name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy code to EC2
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/"

      - name: Build and start containers
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'cd ~/app && docker compose up -d --build --remove-orphans && docker image prune -f'

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health"; then echo; exit 0; fi
            echo "Waiting for gateway ($i/10)..."; sleep 6
          done
          echo "Gateway did not become healthy"; exit 1
